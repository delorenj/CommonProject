# CommonProject Template
# https://copier.readthedocs.io/
#
# Generic base project template. Creates a project skeleton with:
# - minimal source inputs for pjangler-owned BMAD lifecycle initialization
# - Plane project (auto-created in 33god workspace)
# - mise environment management
# - six supported CLI projections (Claude, Codex, Gemini, Copilot, OpenCode, Kimi)

_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_envops:
  block_start_string: "{%"
  block_end_string: "%}"
  variable_start_string: "{{"
  variable_end_string: "}}"
  comment_start_string: "{#"
  comment_end_string: "#}"

# --- Questions (only what we can't derive) ---

project_name:
  type: str
  help: Project name
  validator: "{% if not project_name %}Required{% endif %}"

project_description:
  type: str
  help: One-line description
  default: ""

# Ticket board provider for this project. The board itself is created by
# init-project.sh (create-plane-project.sh) BEFORE copier runs; its identity is
# threaded back in via plane_* below and persisted into .project.json so it is
# the single source of truth shared with the hermes-agent template's agents.
ticket_provider:
  type: str
  help: Ticket board provider this project's board lives in
  default: plane
  choices:
    Linear: linear
    Plane: plane
    Trello: trello

# What this project is. `base` is the generic skeleton below and nothing else.
# `obsidian-plugin` (`pj init --obsidian-plugin`) adds an Obsidian community
# plugin on top of it, vendored from the canonical starter
# obsidianmd/obsidian-sample-plugin @ 07ceb81d (2026-08-02): npm + esbuild +
# TypeScript, manifest.json/versions.json, eslint-plugin-obsidianmd, and its
# build/release workflows moved to the self-hosted runners.
#
# Every type-only path under template/ carries `{% if is_obsidian_plugin %}`
# in its NAME (directories included), so it does not exist in a base render.
# Never name one a bare `.gitignore`/`.npmrc`: npm pack drops those from the
# published pjangler tarball.
#
# A real question on purpose, not `when: false`. Copier records only asked
# questions in .copier-answers.yml; a hidden type would be forgotten, and a
# re-copy would silently re-render the shared files as `base`. `--defaults`
# never prompts for it, and pjangler always passes it with --data.
project_type:
  type: str
  help: What kind of project is this?
  default: base
  choices:
    CommonProject base: base
    Obsidian community plugin: obsidian-plugin

# --- Derived (never asked) ---

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  when: false

is_obsidian_plugin:
  type: bool
  default: "{{ project_type == 'obsidian-plugin' }}"
  when: false

# Obsidian manifest identity (obsidian-plugin only). The catalog rejects a
# plugin id or name containing "obsidian" and frowns on a trailing "plugin",
# and the id must equal the plugin's folder name in a vault, so both are the
# project's own identity with those affixes dropped:
# "obsidian-tag-wrangler" -> id "tag-wrangler".
plugin_id:
  type: str
  default: >-
    {%- set id = project_slug | lower | regex_replace('[^a-z0-9-]+', '-') | replace('obsidian', '') | regex_replace('-+', '-') -%}
    {%- set id = id.strip('-') -%}
    {%- if id.endswith('-plugin') %}{% set id = id[:-7] %}{% endif -%}
    {{ id or 'plugin' }}
  when: false

# A slug-style project name ("obsidian-tag-wrangler") reads as words in the
# Obsidian UI: separators become spaces and an all-lowercase name is
# title-cased ("Tag Wrangler"); a name with its own casing keeps it.
plugin_name:
  type: str
  default: >-
    {%- set name = project_name | regex_replace('(?i)obsidian', ' ') | regex_replace('[-_:.]+', ' ') | regex_replace('\\s+', ' ') | trim -%}
    {%- set name = name | regex_replace('(?i)\\s*\\bplugin$', '') | trim -%}
    {%- if name == name | lower %}{% set name = name | title %}{% endif -%}
    {{ name or project_name }}
  when: false

# TypeScript identifier stem for src/: "tag-wrangler" -> TagWranglerPlugin,
# TagWranglerSettings, TagWranglerSettingTab, TagWranglerModal. The starter's
# own names (MyPlugin, SampleModal, ...) fail eslint-plugin-obsidianmd's
# sample-names rule, and a "Plugin" stem would declare PluginSettingTab over
# Obsidian's own, so those stems get a "Project" suffix.
plugin_class:
  type: str
  default: >-
    {%- set ns = namespace(name='') -%}
    {%- for word in plugin_id.replace('_', '-').replace('.', '-').split('-') -%}
    {%- set ns.name = ns.name ~ (word | capitalize) -%}
    {%- endfor -%}
    {%- if not ns.name or ns.name[0] in '0123456789' %}{% set ns.name = 'Plugin' ~ ns.name %}{% endif -%}
    {%- if ns.name in ['My', 'Sample', 'Plugin'] %}{% set ns.name = ns.name ~ 'Project' %}{% endif -%}
    {{ ns.name }}
  when: false

# The catalog wants a sentence: it must end in punctuation.
plugin_description:
  type: str
  default: >-
    {%- set text = project_description | trim -%}
    {%- if text and text[-1] not in '.?!)' %}{% set text = text ~ '.' %}{% endif -%}
    {{ text or 'Describe what this plugin does.' }}
  when: false

# pjangler passes the operator's git user.name; a bare copier render leaves it
# for the author to fill in.
plugin_author:
  type: str
  default: ""
  when: false

# Board binding — supplied by init-project.sh's --data-file after the board is
# created. Defaults keep a bare `copier copy` rendering valid (empty binding).
plane_workspace:
  type: str
  default: "33god"
  when: false

plane_project_id:
  type: str
  default: ""
  when: false

project_identifier:
  type: str
  default: "{{ project_slug[:4] | upper }}"
  when: false

plane_base:
  type: str
  default: "https://plane.delo.sh"
  when: false

# Drives conditional blocks in rendered files (e.g. _.python.venv in mise.toml).
# Not asked interactively; init-project.sh can override via --data-file.
primary_language:
  type: str
  default: python
  when: false

# Whether to scaffold the project-scoped agent-hooks layer
# (.agents/hooks + the mise enter/leave wiring that injects into each agent CLI's
# per-user config). Defaults true so a bare `copier copy` still gets it. pjangler
# passes `--data agent_hooks_layer=false` when the machine already runs a GLOBAL
# agent-hooks install (~/.agents/hooks) — so a fresh project never re-injects the
# same hooks into shared per-user configs like ~/.codex or ~/.kimi-code.
agent_hooks_layer:
  type: bool
  default: true
  when: false

# When agent_hooks_layer is false, omit only the project-scoped hook tree. The
# skills manifest stays — Skillex writes project-local CLI dirs and is safe
# even on machines that already run a global ~/.agents/hooks install.
# The `.copier-noop-never-matches` sentinel keeps every pattern non-empty when the
# layer is enabled, which copier requires.
_exclude:
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if agent_hooks_layer %}.copier-noop-never-matches{% else %}.agents/hooks{% endif %}"
  - "{% if agent_hooks_layer %}.copier-noop-never-matches{% else %}.agents/hooks/**{% endif %}"
  - "{% if agent_hooks_layer %}.copier-noop-never-matches{% else %}.agents/local.example.json{% endif %}"

_skip_if_exists:
  # Selection is project intent, not generated output. A refresh must preserve
  # inheritance choices, exclusions, and active packs byte-for-byte.
  - ".agents/skills.json"
  # obsidian-plugin seed files: rendered once at creation, owned by the plugin
  # after that. A forced re-render must not reset a bumped manifest version or
  # replace real plugin code with the sample. (Paths a base render never
  # produces, so this is inert for base projects.)
  - "package.json"
  - "package-lock.json"
  - "manifest.json"
  - "versions.json"
  - "styles.css"
  - "tsconfig.json"
  - "esbuild.config.mjs"
  - "eslint.config.mts"
  - "src/**"

# --- Post-generation tasks ---
#
# NOTE: intentionally does NOT run `mise trust`. Trusting the repo fires the mise
# `[hooks].enter` array, which (when the agent-hooks layer is present) injects
# into the caller's shared per-user CLI configs. Scaffolding must never mutate
# global state as a side effect — the operator trusts/enters the repo themselves.
_tasks:
  # A repository ignore file is a portable project contract, never a snapshot
  # of one developer's core.excludesFile. Preserve existing content byte-for-
  # byte and append only the small CommonProject-owned contract when absent.
  # Machine-local backup/editor/CLI exclusions belong in the user's global
  # ignore; `.agents/` is the sole canonical agent-config tree in Git.
  - "touch .gitignore; if [ -s .gitignore ] && [ -n \"$(tail -c 1 .gitignore)\" ]; then printf '\\n' >> .gitignore; fi; grep -Fqx '# CommonProject repository contract' .gitignore 2>/dev/null || printf '%s\\n' '# CommonProject repository contract' >> .gitignore; for pattern in '.env' '.env.*' '!.env.op' '/.agents/local.json' '/.agents/skills'{% if is_obsidian_plugin %} 'node_modules/' '/main.js' '*.map' '/data.json'{% endif %}; do grep -Fqx -- \"$pattern\" .gitignore 2>/dev/null || printf '%s\\n' \"$pattern\" >> .gitignore; done"
  # PJAN-82: use the managed script, which refuses to replace a REAL CLAUDE.md.
  # `ln -sf` cannot distinguish a stale link it owns from a hand-written file it
  # must not touch, so a re-render into a live project destroyed the file and
  # reported success.
  - "./.mise/scripts/link-agentfiles.sh \"$(pwd)\""
  # One explicit project activation after rendering. Trust only this generated
  # config for this process; do not persist trust or execute enter/watch hooks.
  - "MISE_TRUSTED_CONFIG_PATHS=\"$(pwd)/mise.toml\" mise run skills:sync"
  # Stamp the repo's absolute path into .project.json (the SOT) post-render.
  - "python3 -c \"import json,os,pathlib; p=pathlib.Path('.project.json'); d=json.loads(p.read_text()); d['repo_path']=os.getcwd(); p.write_text(json.dumps(d,indent=2)+chr(10))\""
