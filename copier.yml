# CommonProject Template
# https://copier.readthedocs.io/
#
# Generic base project template. Creates a project skeleton with:
# - minimal source inputs for pjangler-owned BMAD lifecycle initialization
# - Plane project (auto-created in 33god workspace)
# - mise environment management
# - six supported CLI projections (Claude, Codex, Gemini, Copilot, OpenCode, Kimi)

_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_envops:
  block_start_string: "{%"
  block_end_string: "%}"
  variable_start_string: "{{"
  variable_end_string: "}}"
  comment_start_string: "{#"
  comment_end_string: "#}"

# --- Questions (only what we can't derive) ---

project_name:
  type: str
  help: Project name
  validator: "{% if not project_name %}Required{% endif %}"

project_description:
  type: str
  help: One-line description
  default: ""

# Ticket board provider for this project. The board itself is created by
# init-project.sh (create-plane-project.sh) BEFORE copier runs; its identity is
# threaded back in via plane_* below and persisted into .project.json so it is
# the single source of truth shared with the hermes-agent template's agents.
ticket_provider:
  type: str
  help: Ticket board provider this project's board lives in
  default: plane
  choices:
    Linear: linear
    Plane: plane
    Trello: trello

# --- Derived (never asked) ---

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  when: false

# Board binding — supplied by init-project.sh's --data-file after the board is
# created. Defaults keep a bare `copier copy` rendering valid (empty binding).
plane_workspace:
  type: str
  default: "33god"
  when: false

plane_project_id:
  type: str
  default: ""
  when: false

project_identifier:
  type: str
  default: "{{ project_slug[:4] | upper }}"
  when: false

plane_base:
  type: str
  default: "https://plane.delo.sh"
  when: false

# Drives conditional blocks in rendered files (e.g. _.python.venv in mise.toml).
# Not asked interactively; init-project.sh can override via --data-file.
primary_language:
  type: str
  default: python
  when: false

# Whether to scaffold the project-scoped agent-hooks + skill fan-out layer
# (.agents/hooks + the mise enter/leave wiring that injects into each agent CLI's
# per-user config). Defaults true so a bare `copier copy` still gets it. pjangler
# passes `--data agent_hooks_layer=false` when the machine already runs a GLOBAL
# agent-hooks install (~/.agents/hooks) — so a fresh project never re-injects the
# same hooks into shared per-user configs like ~/.codex or ~/.kimi-code.
agent_hooks_layer:
  type: bool
  default: true
  when: false

# When agent_hooks_layer is false, omit only the project-scoped hook tree. The
# skills manifest stays — sync-skills.py writes project-local CLI dirs and is safe
# even on machines that already run a global ~/.agents/hooks install.
# The `.copier-noop-never-matches` sentinel keeps every pattern non-empty when the
# layer is enabled, which copier requires.
_exclude:
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if agent_hooks_layer %}.copier-noop-never-matches{% else %}.agents/hooks{% endif %}"
  - "{% if agent_hooks_layer %}.copier-noop-never-matches{% else %}.agents/hooks/**{% endif %}"
  - "{% if agent_hooks_layer %}.copier-noop-never-matches{% else %}.agents/local.example.json{% endif %}"

# --- Post-generation tasks ---
#
# NOTE: intentionally does NOT run `mise trust`. Trusting the repo fires the mise
# `[hooks].enter` array, which (when the agent-hooks layer is present) injects
# into the caller's shared per-user CLI configs. Scaffolding must never mutate
# global state as a side effect — the operator trusts/enters the repo themselves.
_tasks:
  # PJAN-82: seed the base ignore only when there is nothing to lose. `cp` over
  # an existing .gitignore silently discarded whatever the repo already had,
  # every time the template was re-rendered into a live project.
  - "[ -s .gitignore ] || cp ~/.config/git/ignore .gitignore 2>/dev/null || [ -s .gitignore ] || echo '# Add ignores here' > .gitignore"
  # Ensure secrets + per-dev agent-hook/skill overrides are ignored (appended after the base ignore).
  # Each CLI root's hand-owned config is durable project state; the skill
  # projections inside it are not — bmad-method and skills:sync rewrite them
  # on every run, so they are re-ignored after the un-ignore lines (last
  # match wins). _bmad/_config/manifest.yaml pins the version that
  # reproduces them exactly.
  # PJAN-82: appended once (a re-render used to duplicate the whole block), and
  # the skill patterns carry no trailing slash so a SYMLINKED projection is
  # ignored too — .gemini/.copilot/.kimi-code get a symlink, not a directory.
  - "grep -q '^# Generated CLI configurations are durable project state' .gitignore 2>/dev/null || printf '\\n# Secrets + per-dev agent-hook/skill overrides (see .agents/local.example.json)\\n.env\\n.env.*\\n!.env.op\\n.agents/local.json\\n.lastagent\\n**/.claude/settings.local.json\\n\\n# Generated CLI configurations are durable project state...\\n!.claude/\\n!.claude/**\\n!.codex/\\n!.codex/**\\n!.gemini/\\n!.gemini/**\\n!.copilot/\\n!.copilot/**\\n!.opencode/\\n!.opencode/**\\n!.kimi-code/\\n!.kimi-code/**\\n# ...but their skill projections are regenerated, so they stay out of the tree.\\n# No trailing slash: some CLIs get a real directory here and some a symlink.\\n/.agents/skills\\n.claude/skills\\n.codex/skills\\n.gemini/skills\\n.copilot/skills\\n.opencode/skills\\n.kimi-code/skills\\n' >> .gitignore"
  # PJAN-82: use the managed script, which refuses to replace a REAL CLAUDE.md.
  # `ln -sf` cannot distinguish a stale link it owns from a hand-written file it
  # must not touch, so a re-render into a live project destroyed the file and
  # reported success.
  - "./.mise/scripts/link-agentfiles.sh \"$(pwd)\""
  # Materialize the declared Skillex packs' manifest + symlink topology
  # without copying pack content or disturbing project-specific skills.
  - "python3 .mise/scripts/provision-packs.py --root \"$(pwd)\""
  # Stamp the repo's absolute path into .project.json (the SOT) post-render.
  - "python3 -c \"import json,os,pathlib; p=pathlib.Path('.project.json'); d=json.loads(p.read_text()); d['repo_path']=os.getcwd(); p.write_text(json.dumps(d,indent=2)+chr(10))\""
